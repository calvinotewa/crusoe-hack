<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Brain — projects</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 span { color: #8b949e; font-weight: 400; font-size: 14px; }
  .sub { color: #8b949e; margin-bottom: 20px; font-size: 13px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #8b949e; margin: 0 0 12px; }
  a.back { color: #58a6ff; text-decoration: none; cursor: pointer; display: inline-block; margin-bottom: 12px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 16px; max-width: 1280px; align-items: start; }
  .phases { display: flex; gap: 8px; flex-wrap: wrap; }
  .phase { padding: 6px 12px; border-radius: 999px; font-size: 12px; border: 1px solid #30363d; color: #8b949e; background: #0d1117; }
  .phase.active { border-color: #58a6ff; color: #79c0ff; background: #12233d; }
  .phase.done { border-color: #238636; color: #7ee787; }
  .phase.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .running { background: #1f2c1a; color: #7ee787; } .completed { background: #12233d; color: #79c0ff; }
  .failed, .stopped { background: #3d1d20; color: #f85149; } .idle { background: #21262d; color: #8b949e; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .score { font-size: 26px; font-family: ui-monospace, Menlo, monospace; }
  .hint { color: #8b949e; font-size: 12px; }
  label { display: block; font-size: 12px; color: #8b949e; margin: 8px 0 4px; }
  select, input, textarea { width: 100%; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  textarea { resize: vertical; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid #30363d; background: #238636; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
  button.secondary { background: #21262d; color: #e6edf3; }
  button.danger { background: #3d1d20; color: #f85149; }
  button:disabled { opacity: .45; cursor: default; }
  .proj { border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #0d1117; cursor: pointer; }
  .proj:hover { border-color: #58a6ff; }
  .proj .row { margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; }
  .gen { border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #0d1117; }
  details { margin-top: 8px; } summary { cursor: pointer; color: #79c0ff; font-size: 13px; }
  pre { white-space: pre-wrap; font-size: 12px; color: #c9d1d9; background: #161b22; padding: 8px; border-radius: 6px; overflow-x: auto; }
  .hyp { font-size: 12px; color: #c9d1d9; padding-left: 14px; }
  .bar { height: 6px; border-radius: 4px; background: #21262d; overflow: hidden; margin: 6px 0; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #1f6feb, #238636); }
  #events { max-height: 200px; overflow-y: auto; font-size: 12px; }
  #events div { padding: 2px 0; border-bottom: 1px solid #21262d; font-family: ui-monospace, Menlo, monospace; }
  #events .ts { color: #8b949e; }
  a { color: #58a6ff; text-decoration: none; }
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
</style>
</head>
<body>
<div id="app"><div class="hint">loading…</div></div>

<script>
const $ = (id) => document.getElementById(id);
const PHASES = ["agents", "benchmark", "curate", "research", "hypotheses"];
let pollTimer = null;

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(x) { return x != null ? Number(x).toFixed(4) : "—"; }
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.status; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
}

// ---------- router ----------
window.addEventListener("hashchange", route);
route();

async function route() {
  const h = decodeURIComponent(location.hash || "#/projects");
  clearTimeout(pollTimer);
  if (h.startsWith("#/runs/")) return viewRun(h.split("/")[2]);
  if (h.startsWith("#/projects/")) return viewProject(h.split("/")[2]);
  viewProjects();
}

// ---------- projects view ----------
async function viewProjects() {
  const projects = await api("/api/projects").catch((e) => { alert(e); return []; });
  const cards = projects.map((p) => `
    <div class="proj" onclick="location.hash = '#/projects/${p.id}'">
      <div class="row"><strong>${esc(p.name)}</strong><span class="hint">${p.num_runs} run(s)</span></div>
      <div class="hint">${esc((p.goal || "").slice(0, 120))}</div>
      <div class="row" style="margin-top:6px"><span class="mono">${p.num_rows} rows</span>
        <span class="mono">best ${fmt(p.best_score)}</span>
        <span class="hint">${(p.created_at || "").slice(0, 16).replace("T", " ")}</span></div>
    </div>`).join("");
  $("app").innerHTML = `
  <h1>Shared Brain <span>— projects</span></h1>
  <div class="sub">Each project: goal + validation CSV. Runs execute the 5-step loop
  (agents → benchmark → curate → you.com research → hypotheses) and persist
  separately per project in SQLite (<span class="mono">data/dashboard.db</span>): projects → runs → generations → experiments.</div>
  <div class="grid">
    <div class="card">
      <h2>New project</h2>
      <label>Name</label><input id="p-name" placeholder="telecom churn v2">
      <label>Goal (what the agents must achieve)</label>
      <textarea id="p-goal" rows="3" placeholder="Predict churn: y=1 churned, y=0 stayed. Return churn probability per row. Lower RMSE = better."></textarea>
      <label>Validation CSV (needs a <span class="mono">y</span> column)</label>
      <input id="p-file" type="file" accept=".csv,text/csv">
      <label>…or paste CSV</label><textarea id="p-csv" rows="3" class="mono" placeholder="a,b,y&#10;1,2,3"></textarea>
      <button id="p-create" style="margin-top:12px; width:100%">+ Create project</button>
      <div class="hint" style="margin-top:8px">Runs are started from the project page after creation.</div>
    </div>
    <div class="card">
      <h2>Your projects</h2>
      ${cards || '<div class="hint">No projects yet — create one on the left.</div>'}
    </div>
  </div>`;
  $("p-create").onclick = async () => {
    const name = $("p-name").value.trim(), goal = $("p-goal").value.trim();
    if (!name || !goal) return alert("give the project a name and a goal");
    const fd = new FormData();
    fd.append("name", name); fd.append("goal", goal);
    if ($("p-file").files[0]) fd.append("dataset", $("p-file").files[0]);
    else if ($("p-csv").value.trim()) fd.append("csv_text", $("p-csv").value);
    else return alert("upload a CSV file or paste CSV text");
    try {
      const p = await api("/api/projects", { method: "POST", body: fd });
      location.hash = "#/projects/" + p.id;
    } catch (e) { alert("create failed: " + e.message); }
  };
}

// ---------- project view ----------
async function viewProject(pid) {
  const p = await api("/api/projects/" + pid).catch(() => null);
  if (!p) { $("app").innerHTML = '<a class="back" onclick="location.hash=\'#/projects\'">← back</a><div class="hint">project not found</div>'; return; }
  const runs = (p.runs || []).map((r) => `
    <div class="proj" onclick="location.hash = '#/runs/${r.id}'">
      <div class="row"><strong class="mono">${esc(r.id)}</strong>
        ${r.continued_from ? `<span class="hint">↳ continued from <span class="mono">${esc(r.continued_from)}</span></span>` : ""}
        <span class="badge ${esc(r.status)}">${esc(r.status)}</span>
        <span class="mono">best ${fmt(r.best_score)}</span>
        <span class="hint">${(r.started_at || "").slice(0, 16).replace("T", " ")} ·
          ${r.params?.agents ?? "?"} agents × ${r.params?.generations ?? "?"} gens</span></div>
      <div class="hint">${(r.generations_summary || []).map((g) => `g${g.gen}: ${fmt(g.best_score)}`).join(" · ")}</div>
    </div>`).join("");
  $("app").innerHTML = `
  <a class="back" onclick="location.hash = '#/projects'">← projects</a>
  <div class="grid">
    <div>
      <div class="card">
        <div class="row"><strong style="font-size:16px">${esc(p.name)}</strong>
          <button class="danger" id="p-del" style="padding:4px 10px; font-size:12px">delete</button></div>
        <div class="hint" style="margin-top:6px">${esc(p.goal)}</div>
        <div class="row" style="margin-top:10px">
          <span class="mono">${p.num_rows} rows</span>
          <span class="mono">${(p.columns || []).join(", ")}</span></div>
      </div>
      <div class="card">
        <h2>Start a new orchestration run</h2>
        <div class="formgrid">
          <div><label>Agents</label><input id="r-agents" type="number" value="6" min="1" max="100"></div>
          <div><label>Hypotheses (fixed)</label><input id="r-hyp" type="number" value="20" min="1" max="100"></div>
          <div><label>Generations</label><input id="r-gens" type="number" value="2" min="1" max="10"></div>
          <div><label>Summarize top-k</label><input id="r-topk" type="number" value="3" min="1" max="10"></div>
          <div><label>you.com sources</label><input id="r-sources" type="number" value="10" min="0" max="20"></div>
          <div><label>Concurrency</label><input id="r-conc" type="number" value="4" min="1" max="10"></div>
        </div>
        <button id="r-start" style="margin-top:12px; width:100%">▶ Start run</button>
      </div>
    </div>
    <div class="card">
      <h2>Runs (results per project)</h2>
      ${runs || '<div class="hint">No runs yet — start one on the left.</div>'}
    </div>
  </div>`;
  $("r-start").onclick = async () => {
    const body = {
      agents: +$("r-agents").value, hypotheses: +$("r-hyp").value,
      generations: +$("r-gens").value, top_k: +$("r-topk").value,
      sources: +$("r-sources").value, concurrency: +$("r-conc").value,
    };
    try {
      const r = await api(`/api/projects/${pid}/runs`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      location.hash = "#/runs/" + r.id;
    } catch (e) { alert("start failed: " + e.message); }
  };
  $("p-del").onclick = async () => {
    if (!confirm("Delete this project and all its runs?")) return;
    await api("/api/projects/" + pid, { method: "DELETE" });
    location.hash = "#/projects";
  };
  if ((p.runs || []).some((r) => r.status === "running")) pollTimer = setTimeout(() => viewProject(pid), 3000);
}

// ---------- run view ----------
async function viewRun(rid) {
  const r = await api("/api/runs/" + rid).catch(() => null);
  if (!r) { $("app").innerHTML = '<a class="back" onclick="location.hash=\'#/projects\'">← projects</a><div class="hint">run not found</div>'; return; }
  const running = r.status === "running";
  const idx = PHASES.indexOf(r.current_phase);
  const gensDone = (r.generations || []).length;
  const frac = r.params ? gensDone / (r.params.generations || 1) : 0;
  const phaseChips = PHASES.map((ph, i) => `<div class="phase${running ? (i < idx ? " done" : i === idx ? " active pulse" : "") : r.status === "completed" ? " done" : ""}">${i + 1} · ${ph}</div>`).join("");
  const genCards = (r.generations || []).slice().reverse().map((g) => `
    <div class="gen">
      <div class="row"><strong>generation ${g.gen}</strong>
        <span class="mono" style="color:#7ee787">best ${fmt(g.best_score)}</span>
        <span class="hint">${g.num_experiments} experiments · ${g.hypotheses?.length ?? 0} hypotheses (fixed) · ${g.sources?.length ?? 0} sources</span></div>
      <table><tr><th>experiment</th><th>score</th><th>rmse</th></tr>
        ${(g.experiments || []).slice(0, 6).map((e) => `<tr><td>${esc(e.name)}</td><td class="mono">${fmt(e.score)}</td><td class="mono">${e.rmse != null ? e.rmse.toFixed(3) : "—"}</td></tr>`).join("")}</table>
      <details><summary>curator summary &amp; research</summary><pre>${esc((g.summary || "").slice(0, 1600))}</pre>
        <div class="hint">query: <span class="mono">${esc(g.query)}</span></div>
        ${(g.sources || []).slice(0, 8).map((s) => `<div class="hyp">• <a href="${esc(s.url)}" target="_blank">${esc(s.title)}</a></div>`).join("")}</details>
      <details><summary>hypotheses for gen ${g.gen + 1} (${g.hypotheses?.length ?? 0})</summary>
        ${(g.hypotheses || []).slice(0, 12).map((h) => `<div class="hyp">• ${esc(h)}</div>`).join("")}</details>
    </div>`).join("");
  const events = (r.events || []).slice(-120).reverse().map((e) =>
    `<div><span class="ts">${(e.ts || "").slice(11, 19)}</span> [g${e.gen}] ${esc(e.msg)}</div>`).join("");
  $("app").innerHTML = `
  <a class="back" onclick="location.hash = '#/projects/${esc(r.project_id || "")}'">← project</a>
  <div class="grid">
    <div>
      <div class="card">
        <div class="row"><span class="badge ${esc(r.status)}">${esc(r.status)}</span>
          <strong class="mono">run ${esc(rid)}</strong></div>
        <div class="hint">${r.params?.agents} agents × ${r.params?.generations} gens · ${r.params?.hypotheses} fixed hypotheses/gen · dataset columns: ${esc((r.columns || []).join(", "))}</div>
        <div class="phases" style="margin-top:10px">${phaseChips}</div>
        <div class="row" style="margin-top:14px">
          <div><div class="hint">best score (higher = better)</div><div class="score mono">${fmt(r.best_score)}</div></div>
        </div>
        <div class="bar"><i style="width:${Math.min(100, frac * 100)}%"></i></div>
        ${running ? '<button id="r-stop" class="secondary" style="width:100%">■ Stop run</button>' : `
        <div class="card" style="margin-top:10px">
          <h2>Invest more: continue this project</h2>
          <div class="hint">Starts a NEW run in the same project that inherits this run's knowledge:
          the benchmark to beat (${fmt(r.best_score)}), its last hypotheses and its last summary + web learnings.</div>
          <div class="formgrid" style="margin-top:8px">
            <div><label>More generations</label><input id="c-gens" type="number" value="2" min="1" max="10"></div>
            <div><label>Agents (default: keep)</label><input id="c-agents" type="number" placeholder="${r.params?.agents ?? 6}" min="1" max="100"></div>
          </div>
          <button id="c-start" style="margin-top:12px; width:100%">▶ Continue run (+ generations)</button>
        </div>`}
      </div>
      <div class="card"><h2>Event log (live)</h2><div id="events">${events || '<div class="hint">no events</div>'}</div></div>
    </div>
    <div class="card">
      <h2>Generations (results per iteration)</h2>
      ${genCards || '<div class="hint">No generations recorded yet…</div>'}
    </div>
  </div>`;
  if (running) {
    const b = $("r-stop");
    if (b) b.onclick = async () => { await api("/api/runs/" + rid + "/stop", { method: "POST" }); viewRun(rid); };
    pollTimer = setTimeout(() => viewRun(rid), 2000);
  } else {
    const b = $("c-start");
    if (b) b.onclick = async () => {
      const body = { generations: +$("c-gens").value };
      if ($("c-agents").value) body.agents = +$("c-agents").value;
      try {
        const r = await api("/api/runs/" + rid + "/continue", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        location.hash = "#/runs/" + r.id;
      } catch (e) { alert("continue failed: " + e.message); }
    };
  }
}
</script>
</body>
</html>
